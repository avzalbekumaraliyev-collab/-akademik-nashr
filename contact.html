<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Uyga Vazifa</title>
    <style>
        /* CSS qismini shu yerga yozamiz */
    </style>
</head>
<body>

    <!-- 1. Sarlavhalar (2 ta) -->
    <h1 class="sarlavha-1">Asosiy Sarlavha</h1>
    <h2 class="sarlavha-2">Ikkinchi Sarlavha</h2>

    <!-- 2. Paragraflar (2 ta) -->
    <p class="matn-1">Bu birinchi paragraf matni bo'lib, sahifaning bosh qismi hisoblanadi.</p>
    <p class="matn-2">Bu ikkinchi paragraf matni bo'lib, qo'shimcha ma'lumot beradi.</p>

    <!-- 3. Havolalar (2 ta) -->
    <a href="https://google.com" class="havola-1">Google Sayti</a>
    <a href="https://youtube.com" class="havola-2">YouTube Sayti</a>

    <!-- 4. YouTube videolar (2 ta) -->
    <iframe class="yt-video-1" src="https://www.youtube.com/embed/..."></iframe>
    <iframe class="yt-video-2" src="https://www.youtube.com/embed/..."></iframe>

    <!-- 5. Ro'yxatlar (2 ta, har biri 3 tadan element) -->
    <ul class="royxat-1">
        <li>1-element</li>
        <li>2-element</li>
        <li>3-element</li>
    </ul>

    <ol class="royxat-2">
        <li>1-qadam</li>
        <li>2-qadam</li>
        <li>3-qadam</li>
    </ol>

    <!-- 6. Rasmlar (3 ta img) -->
    <img src="rasm1.jpg" alt="Rasm 1" class="rasm-1">
    <img src="rasm2.jpg" alt="Rasm 2" class="rasm-2">
    <img src="rasm3.jpg" alt="Rasm 3" class="rasm-3">

    <!-- 7. Video (1 ta) -->
    <video class="asosiy-video" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

</body>
</html>
